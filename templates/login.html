{% extends "base.html" %}
{% block title %}Login — IDS MANET{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card animate-fade-in">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="text-muted">Sign in to access the IDS dashboard</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-floating mb-3">
                <input type="email" class="form-control glass-input" id="email" 
                       name="email" placeholder="Email" required>
                <label for="email"><i class="bi bi-envelope"></i> Email Address</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control glass-input" id="password" 
                       name="password" placeholder="Password" required>
                <label for="password"><i class="bi bi-lock"></i> Password</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-glow w-100 py-3" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i>
                Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? 
                <a href="{{ url_for('signup') }}" class="auth-link">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
